name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check server.mjs && node --check lib.mjs && node --check i18n.mjs && node --check report.mjs
      - run: npm test
      - run: sh -n deploy/vigia-checkin.sh && sh -n deploy/vigia-collect.sh
      - run: node -e "JSON.parse(require('fs').readFileSync('inventory.example.json','utf8'))"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vigia .
