name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check server.mjs && node --check lib.mjs && node --check i18n.mjs && node --check report.mjs && node --check alerts.mjs && node --check ai.mjs && for f in public/*.js scripts/*.mjs; do node --check "$f"; done
      - run: npm test
      - run: sh -n deploy/vigia-checkin.sh && sh -n deploy/vigia-collect.sh && sh -n deploy/vigia-install.sh && bash -n deploy/vps/setup.sh
      - run: VIGIA_SETUP_DRY=1 VIGIA_DIR=$RUNNER_TEMP/vps bash deploy/vps/setup.sh vigia.example.com && test -s $RUNNER_TEMP/vps/.env && docker compose -f $RUNNER_TEMP/vps/docker-compose.yml --env-file $RUNNER_TEMP/vps/.env config -q
      - run: node -e "JSON.parse(require('fs').readFileSync('inventory.example.json','utf8'))"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vigia .
      - name: Smoke-test the container
        run: |
          docker run -d --name vigia -p 4848:4848 -e CANARY_DAYS=0 -e DASH_PASS=ci vigia
          for i in $(seq 1 30); do curl -fs localhost:4848/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4848/)" = 401
          curl -fs -u vigia:ci localhost:4848/ | grep -q '<title>Vigía</title>'
          curl -fs localhost:4848/app.js > /dev/null
          curl -fs localhost:4848/manifest.webmanifest | grep -q '"name": "Vigía"'
          curl -fs -u vigia:ci -H 'x-vigia-ui: 1' localhost:4848/api/state | grep -q '"version"'
          docker logs vigia
