<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vigía</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#e6e8ee;--mut:#8b91a1;--ok:#3ecf8e;--p1:#e5484d;--p2:#d9822b;--p3:#6b7280;--bd:#262a33}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--tx:#14161a;--mut:#5f6675;--bd:#e3e5ea}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:16px;max-width:1100px}
h1{font-size:20px;margin:0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:24px 0 8px;display:flex;gap:8px;align-items:center}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.card small{color:var(--mut);display:block;margin-top:2px;overflow-wrap:anywhere}.card>div{min-width:0}
.tag{font-weight:700;border-radius:4px;padding:2px 6px;color:#fff;font-size:12px}.P1{background:var(--p1)}.P2{background:var(--p2)}.P3{background:var(--p3)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok)}.dot.bad{background:var(--p1)}.dot.off{background:var(--p3)}
.l{display:flex;align-items:center;gap:10px;min-width:0}.mut{color:var(--mut)}.warn{color:var(--p2)}.r{text-align:right;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 8px;font-size:12px}
.chip.on{border-color:var(--ok)}.chip.off{color:var(--mut)}
@media(max-width:600px){.card{flex-direction:column;align-items:flex-start}.r{text-align:left}}
</style></head><body>
<header><h1>Vigía</h1><div><select id="f"></select> <button id="test"></button></div></header>
<div class="chips" id="chips"></div>
<h2 id="hAlerts"></h2><div id="alerts"></div>
<h2 id="hAssets"></h2><div id="assets"></div>
<h2 id="hBackups"></h2><div id="backups"></div>
<script>
const I={en:{inv:'inventory age',backups:'Backups',noBackups:'No backup jobs in the inventory.',lastOk:'last success',restore:'restore test',size:'size',chainDown:'ALERT CHANNELS FAILING',accept:'Accept change',all:'All',open:'Unacknowledged',test:'Send test alert',alerts:'Active alerts',assets:'Assets',none:'No alerts. All good.',ack:'Acknowledge',acked:'acknowledged',paused:'paused',ago:'ago',never:'never',feed:'feed'},
         es:{inv:'inventario recibido hace',backups:'Copias de seguridad',noBackups:'No hay tareas de copia en el inventario.',lastOk:'última correcta',restore:'prueba de restauración',size:'tamaño',chainDown:'FALLAN LOS CANALES DE AVISO',accept:'Aceptar cambio',all:'Todas',open:'Sin confirmar',test:'Probar aviso',alerts:'Alertas activas',assets:'Activos',none:'Sin alertas. Todo en orden.',ack:'Confirmar',acked:'confirmada',paused:'en pausa',ago:'hace',never:'nunca',feed:'feed'}};
let L=I.en;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{if(!t)return L.never;const s=(Date.now()-t)/1000;return s<90?Math.round(s)+' s':s<5400?Math.round(s/60)+' min':Math.round(s/3600)+' h'};
async function load(){
  const s=await (await fetch('/api/state')).json();
  L=String(s.lang).startsWith('es')?I.es:I.en;document.documentElement.lang=s.lang;
  test.textContent=L.test;hAlerts.textContent=L.alerts;hAssets.textContent=L.assets;
  if(!f.options.length){f.innerHTML=`<option value="open">${L.open}</option><option value="all">${L.all}</option>`}
  hBackups.textContent=L.backups;
  chips.innerHTML=(s.chain&&s.chain.ok===false?`<span class="chip warn"><b>⚠ ${L.chainDown}</b></span>`:'')+
    Object.entries(s.notify).map(([k,v])=>{const c=s.channels[k];const bad=v&&c&&c.ok===false;return `<span class="chip ${bad?'warn':v?'on':'off'}" title="${esc(bad?c.err:'')}">${bad?'⚠':v?'✓':'✗'} ${k}</span>`}).join('')+
    ['uptime','dns','content','kev','osv','eol','domain'].map(k=>`<span class="chip ${s.feeds[k+'Err']?'warn':''}">${k}: ${ago(s.feeds[k])}${s.feeds[k+'Err']?' ⚠':''}</span>`).join('');
  const order={P1:0,P2:1,P3:2};
  const list=s.alerts.filter(a=>f.value==='all'||!a.ack).sort((a,b)=>order[a.prio]-order[b.prio]||b.first-a.first);
  alerts.innerHTML=list.map(a=>
   `<div class="card"><div><span class="tag ${a.prio}">${a.prio}</span> <b>${esc(a.title)}</b><small>${esc(a.body)} · ${ago(a.first)}</small></div>
    <div class="r">${a.ack?`<span class="mut">${L.acked}</span>`:`<button data-k="${esc(a.key)}">${a.accept?L.accept:L.ack}</button>`}</div></div>`).join('')||`<div class="mut">${L.none}</div>`;
  assets.innerHTML=s.inventory.map(a=>{const t=s.status[a.id]||{};return `<div class="card"><div class="l"><span class="dot ${a.paused?'off':t.ok===false?'bad':''}"></span><div><b>${esc(a.client)}</b> · ${esc(a.name)}${a.paused?` <span class="mut">(${L.paused})</span>`:''}<small>${esc(a.url||a.domain)} · ${a.stack.slice(0,6).map(x=>esc(x.slug||x.name||x.product)+' '+esc(x.version||'')).join(', ')}${a.stackCount>6?` +${a.stackCount-6}`:''}${s.pushed[a.id]?.at?` · ${L.inv} ${ago(s.pushed[a.id].at)} (${esc(s.pushed[a.id].host||'')})`:''}</small></div></div>
   <span class="mut r">${t.code||'-'} · ${t.ms??'-'} ms · TLS ${t.tlsDays??'-'} d · ${esc(a.criticality)}</span></div>`}).join('');
  const kb=n=>n==null?'-':n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' kB';
  const bad=new Set(s.alerts.filter(a=>a.key.startsWith('backup:')).map(a=>a.key.split(':').slice(2).join(':')));
  backups.innerHTML=Object.entries(s.backups).map(([k,b])=>`<div class="card"><div class="l"><span class="dot ${bad.has(k)?'bad':''}"></span><div><b>${esc(k)}</b><small>${L.lastOk}: ${b.lastSuccess?ago(b.lastSuccess):L.never} · ${L.restore}: ${b.lastRestoreTest?ago(b.lastRestoreTest):L.never}</small></div></div><span class="mut r">${L.size} ${kb(b.lastBytes)}</span></div>`).join('')||`<div class="mut">${L.noBackups}</div>`;
}
alerts.onclick=async e=>{const k=e.target.dataset.k;if(k){await fetch('/api/ack?key='+encodeURIComponent(k),{method:'POST',headers:{'x-vigia-ui':'1'}});load()}};
test.onclick=()=>fetch('/api/test',{method:'POST',headers:{'x-vigia-ui':'1'}});f.onchange=load;
load();setInterval(load,10000);
</script></body></html>
