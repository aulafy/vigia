<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Four projections of the same A: a small monochrome "time axis". -->
  <!-- 64% centred fit: every painted point remains inside the standard 80% circular safe zone. -->
  <g transform="translate(32 32) scale(.64) translate(-32 -32)" fill="none" stroke-linecap="square" stroke-linejoin="bevel">
    <g stroke="#000" stroke-width="6">
      <path d="M17 50 39 4 61 50M26 32h26"/>
      <path d="M14 52 36 6 58 52M23 34h26"/>
      <path d="M11 54 33 8 55 54M20 36h26"/>
    </g>
    <g stroke="#fff" stroke-width="2.25">
      <path d="M17 50 39 4 61 50M26 32h26"/>
      <path d="M14 52 36 6 58 52M23 34h26"/>
      <path d="M11 54 33 8 55 54M20 36h26"/>
    </g>

    <!-- The front projection is black, edged in white so it survives either theme. -->
    <path d="M8 56 30 10 52 56M17 38h26" stroke="#fff" stroke-width="10"/>
    <path d="M8 56 30 10 52 56M17 38h26" stroke="#000" stroke-width="6.5"/>
  </g>
</svg>
